<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RealTime</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.20),
                    transparent 35%
                ),
                #0b1020;
        }

        .auth-wrapper {
            width: min(440px, 90%);
        }

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;

            margin-bottom: 30px;

            font-size: 22px;
            font-weight: 700;
        }

        .brand-icon {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #6366f1;
        }

        .auth-card {
            padding: 40px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid rgba(255,255,255,0.09);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.30);
        }

        .auth-card h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;
            font-weight: 600;
        }

        form input {
            width: 100%;

            padding: 14px 16px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,0.14);

            background:
                rgba(255,255,255,0.05);

            color: white;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        form input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.15);
        }

        .errorlist {
            list-style: none;

            margin-bottom: 10px;

            color: #fca5a5;

            font-size: 13px;
        }

        .login-button {
            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background: #6366f1;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #4f46e5;

            transform: translateY(-1px);
        }

        .account-link {
            margin-top: 25px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
        }

        .account-link a {
            color: #a5b4fc;

            text-decoration: none;

            font-weight: 600;
        }

        .account-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 22px;

            text-align: center;

            color: #64748b;

            font-size: 12px;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-wrapper">

        <div class="brand">
            <div class="brand-icon">
                ◉
            </div>

            RealTime
        </div>


        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to access your secure meetings and real-time collaboration tools.
            </p>


            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="login-button"
                >
                    Login →
                </button>

            </form>


            <p class="account-link">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </p>


            <div class="security-note">
                🔒 Secure authentication powered by Django
            </div>

        </div>

    </div>

</body>
</html>
